      <stop offset="0.5" stop-color="#9fe870" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9fe870" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
