<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Chirag Jangir — engineering profile header</title>
  <desc id="desc">A restrained dark technical banner with a green signal line, abstract system nodes, and an engineering-focused identity.</desc>
  <defs>
