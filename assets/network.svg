<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-label="GitHub network panel for chiragjangiir. Live follower data appears after the workflow runs.">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;white-space:pre}</style>
<rect x="1" y="1" width="878" height="244" rx="14" fill="#0d1117" stroke="#1f3a2c" stroke-width="2"/>
<rect x="28" y="24" width="96" height="24" rx="12" fill="none" stroke="#00ff88"/>
