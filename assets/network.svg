<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">GitHub network snapshot</title>
  <desc id="desc">A dark terminal-inspired panel for public repository and follower statistics, refreshed by the repository workflow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111612"/><stop offset="1" stop-color="#0a0d0b"/></linearGradient><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#b7d8bd" fill-opacity=".13"/></pattern></defs>
  <rect width="1200" height="150" rx="12" fill="url(#bg)"/><rect width="1200" height="150" rx="12" fill="url(#dots)"/><rect x=".5" y=".5" width="1199" height="149" rx="11.5" fill="none" stroke="#8da895" stroke-opacity=".24"/>
  <text x="28" y="31" fill="#9be8b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ gh api /users/chiragjangiir</text>
  <text x="28" y="62" fill="#e6efe8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">PUBLIC PROFILE SNAPSHOT</text>
  <text x="28" y="88" fill="#819084" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Stats are fetched from GitHub's public API.</text>
  <g transform="translate(560 35)"><rect width="175" height="82" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#829987" stroke-opacity=".28"/><text x="16" y="25" fill="#849488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">FOLLOWERS</text><text id="followers" x="16" y="59" fill="#9be8b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">—</text></g>
  <g transform="translate(750 35)"><rect width="175" height="82" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#829987" stroke-opacity=".28"/><text x="16" y="25" fill="#849488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">PUBLIC REPOS</text><text id="repos" x="16" y="59" fill="#9be8b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">—</text></g>
  <g transform="translate(940 35)"><rect width="232" height="82" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#829987" stroke-opacity=".28"/><text x="16" y="25" fill="#849488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">LATEST FOLLOWERS</text><text id="recent" x="16" y="49" fill="#dce8de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Refresh workflow pending</text><text x="16" y="66" fill="#7c8b7f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">daily update</text></g>
</svg>
