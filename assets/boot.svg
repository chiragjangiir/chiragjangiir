<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Chirag Jangir — terminal profile header</title>
  <desc id="desc">A dark terminal window introducing an engineer working on AI systems, developer tools, and open source.</desc>
  <defs>
